name: Deploy test Atlas to GitHub Pages

on:
  push:
    branches: [pages-test]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Inject Geoapify key
        env:
          GEOAPIFY_API_KEY: ${{ secrets.GEOAPIFY_API_KEY }}
        run: |
          python3 - <<'PY'
          import json, os
          key = os.environ["GEOAPIFY_API_KEY"]
          with open("geocoding-config.js", "w") as f:
              f.write("/* Generated during deployment; browser-visible by design. */\n")
              f.write("window.ATLAS_GEOCODING = { apiKey: " + json.dumps(key) + " };\n")
          PY

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
